<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediblei | Bonus CSS Grid</title>
    <link rel="icon" type="image/png" href="img/logo-mediblei.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <header class="profile-placeholder">
            <h1>Mediblei APS — bonus Grid</h1>
            <p>Qui ricostruiremo il profilo, dopo aver completato la griglia.</p>
        </header>

        <section class="posts" aria-labelledby="posts-title">
            <h2 id="posts-title">Post</h2>
            <!-- Il primo post occupa due colonne e due righe; gli altri riempiono le celle libere. -->
            <div class="posts-grid">
                <div class="post post-featured">
                    <img src="img/itinerari-coraggio-01.jpg" alt="Balconi e targa commemorativa di Giuseppe Fava a Palazzolo Acreide">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-02.jpg" alt="Partecipanti lungo una scalinata in pietra durante Itinerari di coraggio">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-04.jpg" alt="Visita guidata tra le scalinate e il verde di Palazzolo Acreide">
                </div>

                <div class="post">
                    <img src="img/itinerari-coraggio-05.jpg" alt="Gruppo in ascolto della guida davanti al panorama degli Iblei">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-07.jpg" alt="Musicista con chitarra acustica e microfono durante Itinerari di coraggio">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-09.jpg" alt="Pubblico in teatro con un libro illustrato tra le poltrone rosse">
                </div>
            </div>
        </section>

    </main>
</body>

</html>
