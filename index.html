<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediblei | Bonus CSS Grid</title>
    <link rel="icon" type="image/png" href="img/logo-mediblei.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="container">
        <header class="profile">
            <h1>Mediblei APS</h1>
            <img class="profile-avatar" src="img/logo-mediblei.png"
                alt="Logo MIB Mediblei, visioni di comunità" width="150" height="150">
            <p class="profile-username">@mib_mediblei</p>

            <!-- Numeri dimostrativi per l'esercizio, non metriche reali. -->
            <ul class="profile-stats" aria-label="Statistiche dimostrative del profilo">
                <li><strong>164</strong><span>Seguiti</span></li>
                <li><strong>1.9K</strong><span>Follower</span></li>
                <li><strong>12.5K</strong><span>Mi piace</span></li>
            </ul>

            <div class="profile-actions">
                <a class="profile-follow" href="https://www.tiktok.com/@mib_mediblei"
                    aria-label="Follow: visita Mediblei su TikTok">Follow</a>
                <a class="profile-instagram" href="https://www.instagram.com/mib_mediblei/"
                    aria-label="Visita il profilo Instagram di Mediblei" title="Instagram di Mediblei">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none"
                        stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
                        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                    </svg>
                </a>
                <!-- Pulsante dimostrativo: nessun menu previsto nell'esercizio. -->
                <button class="profile-more" type="button" aria-label="Altre opzioni (dimostrativo)"
                    aria-disabled="true" title="Pulsante dimostrativo">
                    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                        <path d="M2 5h12L8 11z" fill="currentColor"></path>
                    </svg>
                </button>
            </div>

            <div class="profile-bio">
                <p>Libri, arte e cultura nel cuore degli Iblei.</p>
                <p>Mostre, incontri e percorsi alla scoperta del territorio.</p>
                <p>Uno spazio di comunità a Palazzolo Acreide.</p>
            </div>
            <a class="profile-website" href="https://www.mediblei.com/">www.mediblei.com</a>
        </header>

        <section class="posts" aria-labelledby="posts-title">
            <h2 id="posts-title">Post</h2>
            <!-- Il primo post occupa due colonne e due righe; gli altri riempiono le celle libere. -->
            <div class="posts-grid">
                <div class="post post-featured">
                    <img src="img/itinerari-coraggio-01.jpg" alt="Balconi e targa commemorativa di Giuseppe Fava a Palazzolo Acreide">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-02.jpg" alt="Partecipanti lungo una scalinata in pietra durante Itinerari di coraggio">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-04.jpg" alt="Visita guidata tra le scalinate e il verde di Palazzolo Acreide">
                </div>

                <div class="post">
                    <img src="img/itinerari-coraggio-05.jpg" alt="Gruppo in ascolto della guida davanti al panorama degli Iblei">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-07.jpg" alt="Musicista con chitarra acustica e microfono durante Itinerari di coraggio">
                </div>
                <div class="post">
                    <img src="img/itinerari-coraggio-09.jpg" alt="Pubblico in teatro con un libro illustrato tra le poltrone rosse">
                </div>
            </div>
        </section>

    </main>
</body>

</html>
